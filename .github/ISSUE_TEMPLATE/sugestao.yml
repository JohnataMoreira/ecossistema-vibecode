name: 💡 Sugerir uma capacidade
description: O que o ecossistema deveria passar a fazer?
labels: ["sugestão"]
body:
  - type: textarea
    id: ideia
    attributes:
      label: Qual é a ideia?
    validations: {required: true}
  - type: textarea
    id: problema
    attributes:
      label: Que problema seu isso resolveria?
    validations: {required: true}
  - type: textarea
    id: como
    attributes:
      label: Como você imagina que funcionaria? (opcional)
